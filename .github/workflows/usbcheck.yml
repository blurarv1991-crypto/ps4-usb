name: Ver USB

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/usbcheck.yml'

jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - name: Ejemplo de red
        run: |
          git clone --depth 1 --branch v0.5.4 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git src
          S=src/samples/networking
          echo "=== RESULTADO ==="
          echo "--- archivos del ejemplo ---"
          find $S -type f | head -20
          echo "--- main.cpp ---"
          head -120 $S/networking/main.cpp
          echo "--- Makefile (librerias) ---"
          grep -nE "LIBS|-l" $S/Makefile | head -10
          echo "--- structs en net.h ---"
          sed -n 20,60p src/include/orbis/_types/net.h
          echo "--- sysmodule NET ---"
          grep -nE "INTERNAL_NET|SYSMODULE_NET" src/include/orbis/_types/sysmodule.h
