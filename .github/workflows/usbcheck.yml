name: Ver USB

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/usbcheck.yml'

jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - name: Detalle de Bgft y AppInstUtil
        run: |
          git clone --depth 1 --branch v0.5.4 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git src
          I=src/include/orbis
          echo "=== RESULTADO ==="
          echo "--- Bgft.h ---"
          cat $I/Bgft.h
          echo "--- AppInstUtil.h ---"
          cat $I/AppInstUtil.h
          echo "--- _types/bgft.h ---"
          head -150 $I/_types/bgft.h
          echo "--- _types/appinst_util.h ---"
          head -150 $I/_types/appinst_util.h
          echo "--- sysmodule ---"
          grep -niE "bgft|appinst" $I/_types/sysmodule.h
