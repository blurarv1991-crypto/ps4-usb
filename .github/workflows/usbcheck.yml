name: Ver USB

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/usbcheck.yml'

jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - name: Detalle de Net
        run: |
          git clone --depth 1 --branch v0.5.4 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git src
          I=src/include/orbis
          echo "=== RESULTADO ==="
          echo "--- Net.h: funciones clave ---"
          grep -nE "sceNet(Init|Term|PoolCreate|PoolDestroy|Socket|SocketClose|Connect|Bind|Listen|Accept|Send|Recv|Htons|Htonl|InetPton|Setsockopt)\b" $I/Net.h
          echo "--- structs de red ---"
          grep -rnE "struct .*Sockaddr|OrbisNetSockaddr|ORBIS_NET_(AF_INET|SOCK_STREAM|IPPROTO_TCP)" $I/_types/net.h $I/Net.h | head -30
          echo "--- samples con red ---"
          ls src/samples
          grep -rlE "sceNetSocket|socket\(" src/samples | head -10
