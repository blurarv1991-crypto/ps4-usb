name: Ver USB

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/usbcheck.yml'

jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - name: Detalle USB del toolchain
        run: |
          git clone --depth 1 --branch v0.5.4 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git src
          echo "=== Libs usb/sysmodule ==="
          find src/lib -iname "*usb*" -o -iname "*sysmodule*" | head -20
          echo "=== Usbd.h: init, lista, descriptor, open, claim, bulk ==="
          grep -nE "sceUsbd(Init|Exit|GetDeviceList|FreeDeviceList|GetDeviceDescriptor|Open|Close|ClaimInterface|BulkTransfer|HandleEvents)\b" src/include/orbis/Usbd.h
          echo "=== Usbd.h: structs ==="
          grep -nE "typedef struct|SceUsbd[A-Za-z]*Descriptor|idVendor|idProduct|bDeviceClass" src/include/orbis/Usbd.h | head -40
          echo "=== Usbd.h: inicio ==="
          head -30 src/include/orbis/Usbd.h
          echo "=== Sysmodule USB ==="
          grep -rniE "usb" src/include/orbis/_types/sysmodule.h | head -10
